<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="plannic-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="plannic-grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="plannic-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#plannic-grad-bg)" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="3" />
  
  <!-- Isometric Hexagon Architectural Core -->
  <polygon points="64,30 94,47 64,64 34,47" fill="url(#plannic-grad-cyan)" />
  <polygon points="34,47 64,64 64,98 34,81" fill="url(#plannic-grad-indigo)" />
  <polygon points="64,64 94,47 94,81 64,98" fill="#1E1B4B" stroke="#6366F1" stroke-width="2" />

  <!-- Outlines -->
  <polyline points="34,47 64,30 94,47" stroke="#BAE6FD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="64" y1="30" x2="64" y2="64" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="64" x2="64" y2="98" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Connected Nodes -->
  <circle cx="64" cy="30" r="4.5" fill="#38BDF8" />
  <circle cx="94" cy="47" r="4" fill="#818CF8" />
  <circle cx="94" cy="81" r="4" fill="#38BDF8" />
  <circle cx="64" cy="98" r="4.5" fill="#38BDF8" />
  <circle cx="34" cy="81" r="4" fill="#818CF8" />
  <circle cx="34" cy="47" r="4" fill="#38BDF8" />

  <!-- Center Core -->
  <circle cx="64" cy="64" r="5" fill="#FFFFFF" />
  <circle cx="64" cy="64" r="2.5" fill="#0284C7" />
</svg>