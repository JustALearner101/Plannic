<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="380" height="96" fill="none">
  <defs>
    <linearGradient id="pl-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pl-grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="pl-grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="pl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Container (72x72) -->
  <g transform="translate(12, 12)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" />
    
    <!-- Top Face -->
    <polygon points="36,16 54,26 36,36 18,26" fill="url(#pl-grad-cyan)" opacity="0.9" />
    <!-- Left Face -->
    <polygon points="18,26 36,36 36,56 18,46" fill="url(#pl-grad-indigo)" opacity="0.85" />
    <!-- Right Face -->
    <polygon points="36,36 54,26 54,46 36,56" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />

    <!-- Highlights -->
    <polyline points="18,26 36,16 54,26" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="36" y1="16" x2="36" y2="36" stroke="#BAE6FD" stroke-width="1" stroke-linecap="round" />
    <line x1="36" y1="36" x2="36" y2="56" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Nodes -->
    <circle cx="36" cy="16" r="3" fill="#38BDF8" filter="url(#pl-glow)" />
    <circle cx="54" cy="26" r="2.5" fill="#818CF8" />
    <circle cx="54" cy="46" r="2.5" fill="#38BDF8" />
    <circle cx="36" cy="56" r="3" fill="#38BDF8" filter="url(#pl-glow)" />
    <circle cx="18" cy="46" r="2.5" fill="#818CF8" />
    <circle cx="18" cy="26" r="2.5" fill="#38BDF8" />
    <circle cx="36" cy="36" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typography & Tagline -->
  <g transform="translate(100, 22)">
    <!-- Wordmark -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-size="34" font-weight="800" letter-spacing="2.5" fill="url(#pl-grad-text)">
      PLANNIC
    </text>
    <text x="172" y="16" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" letter-spacing="1" fill="#38BDF8">
      CORE
    </text>

    <!-- Subtitle -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.8" fill="#94A3B8">
      ARCHITECTURE &amp; PLANNING WORKBENCH
    </text>
  </g>
</svg>
