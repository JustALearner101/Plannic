name: Headless Release Assets

on:
  release:
    types: [published]

jobs:
  headless:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            asset: plannic-headless-linux-x64.tar.gz
          - runner: ubuntu-24.04-arm
            asset: plannic-headless-linux-arm64.tar.gz
          - runner: macos-15-intel
            asset: plannic-headless-darwin-x64.tar.gz
          - runner: macos-14
            asset: plannic-headless-darwin-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: mkdir -p dist && bun build apps/headless/src/index.ts --compile --outfile dist/plannic-headless
      - run: tar -czf "${{ matrix.asset }}" -C dist plannic-headless
      - run: shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
        if: startsWith(matrix.runner, 'macos-')
      - run: sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
        if: startsWith(matrix.runner, 'ubuntu-')
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  windows:
    name: Headless release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: New-Item -ItemType Directory -Force dist | Out-Null; bun build apps/headless/src/index.ts --compile --outfile dist/plannic-headless.exe
      - run: Compress-Archive -Path dist/plannic-headless.exe -DestinationPath plannic-headless-windows-x64.zip
      - run: (Get-FileHash plannic-headless-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  plannic-headless-windows-x64.zip' | Set-Content plannic-headless-windows-x64.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            plannic-headless-windows-x64.zip
            plannic-headless-windows-x64.zip.sha256
