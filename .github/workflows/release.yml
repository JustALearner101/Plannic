name: Release Plannic Desktop & CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-desktop:
    name: Release Desktop & Windows CLI
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install JavaScript dependencies
        run: bun install

      - name: Run typecheck & unit tests
        run: |
          bun run typecheck
          bun run test:all

      - name: Build and Release Tauri App with Auto-Updater
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: './apps/desktop'
          tagName: ${{ github.ref_name }}
          releaseName: 'Plannic ${{ github.ref_name }}'
          releaseBody: 'See the attached assets to download and install this version. Auto-updater will automatically detect this release manifest.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPrefer: 'latest'

      - name: Build Unified CLI
        run: bun run build:plannic

      - name: Run Smoke Test on Windows CLI
        run: bun run test:smoke

      - name: Package Windows CLI
        shell: pwsh
        run: |
          Compress-Archive -Path dist/plannic.exe -DestinationPath plannic-windows-x64.zip
          (Get-FileHash plannic-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  plannic-windows-x64.zip' | Set-Content plannic-windows-x64.zip.sha256

      - name: Upload Windows CLI
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plannic-windows-x64.zip
            plannic-windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-cli-posix:
    name: Release CLI (${{ matrix.target }})
    needs: release-desktop
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            archive: plannic-linux-x64.tar.gz
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            archive: plannic-linux-arm64.tar.gz
          - runner: macos-15-intel
            target: darwin-x64
            archive: plannic-darwin-x64.tar.gz
          - runner: macos-14
            target: darwin-arm64
            archive: plannic-darwin-arm64.tar.gz
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Unified CLI
        run: bun run build:plannic

      - name: Run Automated Release Smoke Test
        run: bun run test:smoke

      - name: Package POSIX CLI Archive
        run: |
          tar -czf ${{ matrix.archive }} -C dist plannic
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          else
            shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          fi

      - name: Upload POSIX CLI Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
