name: Release Plannic Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install JavaScript dependencies
        run: bun install

      - name: Run typecheck & unit tests
        run: |
          bun run typecheck
          bun run test:all

      - name: Build and Release Tauri App with Auto-Updater
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: './apps/desktop'
          tagName: ${{ github.ref_name }}
          releaseName: 'Plannic ${{ github.ref_name }}'
          releaseBody: 'See the attached assets to download and install this version. Auto-updater will automatically detect this release manifest.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPrefer: 'latest'

      - name: Build Unified CLI
        run: bun run build:plannic

      - name: Package Unified CLI
        shell: pwsh
        run: |
          Compress-Archive -Path dist/plannic.exe -DestinationPath plannic-windows-x64.zip
          (Get-FileHash plannic-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  plannic-windows-x64.zip' | Set-Content plannic-windows-x64.zip.sha256

      - name: Upload Unified CLI
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plannic-windows-x64.zip
            plannic-windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
